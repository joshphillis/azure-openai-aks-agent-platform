---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agents
  labels:
    app: orchestrator
    workload: ai-agents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sa-orchestrator
      imagePullSecrets:
        - name: acr-secret
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "ai-agents"
          effect: "NoSchedule"
      nodeSelector:
        workload: ai-agents
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: orchestrator
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "spc-orchestrator"
      containers:
        - name: orchestrator
          image: craiplatformdevjp001.azurecr.io/orchestrator:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true
          env:
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: openai-endpoint
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: openai-gpt4o-deployment
            - name: SERVICEBUS_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: servicebus-namespace
            - name: AGENT_NAME
              value: "orchestrator"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: agents
spec:
  selector:
    app: orchestrator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-orchestrator
  namespace: agents
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: orchestrator
