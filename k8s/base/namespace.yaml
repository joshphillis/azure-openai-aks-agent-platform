  labels:
    azure.workload.identity/use: "true"
---
# One ServiceAccount per agent — annotated with the managed identity client ID
# that Terraform created. Replace <client-id> values with output of:
# terraform output -json agent_identity_client_ids

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-orchestrator
  namespace: agents
  annotations:
    azure.workload.identity/client-id: "653456bf-382f-4c73-82ea-a33a8cc91fa7"
---
apiVersion: v1
kind: ServiceAccount
