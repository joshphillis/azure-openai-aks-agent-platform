###############################################################################
# k8s/base/secret-provider-classes.yaml
#
# One SecretProviderClass per agent — mounts Key Vault secrets as files
# and syncs them into a Kubernetes Secret (agent-secrets) that Deployments
# reference via secretKeyRef.
#
# Replace <keyvault-name> and <tenant-id> with your actual values.
# These are the same for all agents since they share one vault.
###############################################################################

---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-orchestrator
  namespace: agents
spec:
  provider: azure
  secretObjects:
    - secretName: agent-secrets
      type: Opaque
      data:
        - objectName: openai-endpoint
          key: openai-endpoint
        - objectName: openai-gpt4o-deployment
          key: openai-gpt4o-deployment
        - objectName: openai-embeddings-deployment
          key: openai-embeddings-deployment
        - objectName: servicebus-namespace
          key: servicebus-namespace
  parameters:
    usePodIdentity: "false"
    clientID: "3adef8db-9a2d-4d0e-8788-abe616e2e37a"   # terraform output agent_identity_client_ids
    keyvaultName: "kv-aiplatform-dev-jp001"        # terraform output keyvault_name (from keyvault module)
    tenantId: "a8a7d7cc-28f1-4438-a292-bd49c96cd0ab"                # az account show --query tenantId -o tsv
    objects: |
      array:
        - |
          objectName: openai-endpoint
          objectType: secret
        - |
          objectName: openai-gpt4o-deployment
          objectType: secret
        - |
          objectName: openai-embeddings-deployment
          objectType: secret
        - |
          objectName: servicebus-namespace
          objectType: secret

