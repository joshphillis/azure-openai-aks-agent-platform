###############################################################################
# k8s/overlays/dev/kustomization.yaml
#
# Dev overlay — patches base with dev-appropriate replica counts and image tags.
# The agents.yml pipeline updates the images block on every merge via:
#   kustomize edit set image ...
###############################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agents

resources:
  - ../../base

# Image tags — updated automatically by agents.yml CI pipeline
images:
  - name: craiplatformdevjp001.azurecr.io/orchestrator
    newTag: latest
  - name: craiplatformdevjp001.azurecr.io/research-agent
    newTag: latest
  - name: craiplatformdevjp001.azurecr.io/analysis-agent
    newTag: latest
  - name: craiplatformdevjp001.azurecr.io/writer-agent
    newTag: latest

# Dev patches — reduce replicas to save cost
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: orchestrator

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

    target:
      kind: Deployment
      labelSelector: "workload=ai-agents"

commonLabels:
  environment: dev
